<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JAY BARBER | 이발 예약</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111;color:#fff;text-align:center;padding:30px 18px}h1{margin:0;font-size:28px}header p{margin:7px 0 0;color:#bbb}.wrap{max-width:560px;margin:25px auto;padding:0 16px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 5px 20px #00000012}h2{margin:0 0 20px}label{display:block;font-weight:700;margin:17px 0 7px}input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fff}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.time{padding:12px 5px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:15px;cursor:pointer}.time.selected{background:#111;color:#fff;border-color:#111}.time:disabled{background:#eee;color:#aaa;cursor:not-allowed;text-decoration:line-through}.submit{width:100%;margin-top:22px;padding:15px;border:0;border-radius:11px;background:#111;color:#fff;font-size:17px;font-weight:700;cursor:pointer}.notice{padding:12px;background:#f1f1f1;border-radius:10px;color:#555;font-size:14px}.success{text-align:center;padding:25px 5px}.check{font-size:50px}.hidden{display:none}@media(max-width:430px){.times{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header><h1>JAY BARBER</h1><p>군부대 이발 예약</p></header>
<div class="wrap">
<div id="booking" class="card">
<h2>이발 예약</h2>
<div class="notice">원하는 날짜와 시간을 선택해 주세요.<br>예약 가능한 시간만 선택할 수 있습니다.</div>
<label for="company">중대</label>
<select id="company"><option value="작전지원 중대">작전지원 중대</option><option value="본부중대">본부중대</option></select>
<label for="room">생활관 이름</label>
<input id="room" placeholder="예: 3생활관">
<label for="date">예약 날짜</label>
<input id="date" type="date">
<label>예약 시간</label>
<div id="times" class="times"></div>
<button class="submit" onclick="book()">예약하기</button>
</div>
<div id="done" class="card hidden"><div class="success"><div class="check">✓</div><h2>예약 완료</h2><p id="doneText"></p><div class="notice">예약번호를 캡처해 두세요.</div><button class="submit" onclick="location.reload()">새 예약</button></div></div>
</div>
<script>
const slots=["10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00"];
const date=document.getElementById('date'),times=document.getElementById('times');let selected='';
function today(){return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'})}
date.min=today();date.value=today();
function key(){return 'jaybarber_reservations_v1'}
function get(){return JSON.parse(localStorage.getItem(key())||'[]')}
function render(){selected='';times.innerHTML='';const booked=get().filter(x=>x.date===date.value).map(x=>x.time);slots.forEach(t=>{const b=document.createElement('button');b.className='time';b.textContent=t;b.disabled=booked.includes(t);b.onclick=()=>{document.querySelectorAll('.time').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=t};times.appendChild(b)})}
function book(){const room=document.getElementById('room').value.trim();if(!room)return alert('생활관 이름을 입력해 주세요.');if(!selected)return alert('예약 시간을 선택해 주세요.');const arr=get();if(arr.some(x=>x.date===date.value&&x.time===selected)){render();return alert('이미 예약된 시간입니다.');}const id='JB-'+Date.now().toString().slice(-6);arr.push({id,company:document.getElementById('company').value,room,date:date.value,time:selected,created:new Date().toISOString()});localStorage.setItem(key(),JSON.stringify(arr));document.getElementById('booking').classList.add('hidden');document.getElementById('done').classList.remove('hidden');document.getElementById('doneText').innerHTML=`<b>${date.value}</b> ${selected}<br>${document.getElementById('company').value}<br>${room}<br><br>예약번호 <b>${id}</b>`}
date.addEventListener('change',render);render();
</script></body></html>
