<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAY BARBER 예약</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 30px;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 8px 0 28px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    .times {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .time-btn {
      padding: 13px 5px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: white;
      font-size: 15px;
      cursor: pointer;
    }

    .time-btn:hover {
      background: #f1f1f1;
    }

    .time-btn.selected {
      background: #111;
      color: white;
      border-color: #111;
    }

    .time-btn.booked {
      background: #e9e9e9;
      color: #aaa;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    button.reserve {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 11px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button.reserve:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .notice {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      color: #777;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #e9f7ef;
      color: #187a45;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #c62828;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>JAY BARBER</h1>
    <div class="subtitle">커트 예약</div>

    <label for="company">중대</label>
    <select id="company">
      <option value="">중대를 선택하세요</option>
      <option value="작전지원 중대">작전지원 중대</option>
      <option value="본부중대">본부중대</option>
    </select>

    <label for="barracks">생활관 이름</label>
    <input
      id="barracks"
      type="text"
      placeholder="예: 3생활관"
      maxlength="30"
    >

    <label for="date">예약 날짜</label>
    <input id="date" type="date">

    <label>예약 시간</label>
    <div id="times" class="times"></div>

    <button id="reserveBtn" class="reserve" disabled>
      예약하기
    </button>

    <div class="notice">
      커트 1명 / 30분
    </div>

    <div id="message" class="message"></div>

  </div>
</div>

<script>
  const SUPABASE_URL = "https://rupsdtnlkxyesgvnwpor.supabase.co";
  const SUPABASE_KEY = "sb_publishable_OIcz_R6kDyWs8z_rZN1V_w_-CTf5Fno";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const companyEl = document.getElementById("company");
  const barracksEl = document.getElementById("barracks");
  const dateEl = document.getElementById("date");
  const timesEl = document.getElementById("times");
  const reserveBtn = document.getElementById("reserveBtn");
  const messageEl = document.getElementById("message");

  const times = [
    "17:00",
    "17:30",
    "18:00",
    "18:30",
    "19:00",
    "19:30",
    "20:00",
    "20:30",
    "21:00"
  ];

  let selectedTime = "";

  // 오늘 이전 날짜 선택 방지
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, "0");
  const dd = String(today.getDate()).padStart(2, "0");
  dateEl.min = `${yyyy}-${mm}-${dd}`;

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = `message ${type}`;
  }

  function clearMessage() {
    messageEl.textContent = "";
    messageEl.className = "message";
  }

  async function loadBookedTimes() {
    selectedTime = "";
    reserveBtn.disabled = true;
    clearMessage();

    timesEl.innerHTML = "";

    if (!dateEl.value) {
      return;
    }

    const { data, error } = await supabaseClient
      .from("bookings")
      .select("booking_time")
      .eq("booking_date", dateEl.value);

    if (error) {
      console.error(error);
      showMessage("예약 정보를 불러오지 못했습니다.", "error");
      return;
    }

    const bookedTimes = new Set(
      data.map(row => row.booking_time.slice(0, 5))
    );

    times.forEach(time => {
      const button = document.createElement("button");

      button.type = "button";
      button.className = "time-btn";
      button.textContent = time;

      if (bookedTimes.has(time)) {
        button.classList.add("booked");
        button.disabled = true;
      } else {
        button.addEventListener("click", () => {
          document
            .querySelectorAll(".time-btn.selected")
            .forEach(btn => btn.classList.remove("selected"));

          button.classList.add("selected");
          selectedTime = time;

          checkForm();
        });
      }

      timesEl.appendChild(button);
    });
  }

  function checkForm() {
    reserveBtn.disabled = !(
      companyEl.value &&
      barracksEl.value.trim() &&
      dateEl.value &&
      selectedTime
    );
  }

  companyEl.addEventListener("change", checkForm);

  barracksEl.addEventListener("input", checkForm);

  dateEl.addEventListener("change", loadBookedTimes);

  reserveBtn.addEventListener("click", async () => {

    if (!companyEl.value ||
        !barracksEl.value.trim() ||
        !dateEl.value ||
        !selectedTime) {
      return;
    }

    reserveBtn.disabled = true;
    reserveBtn.textContent = "예약 중...";

    clearMessage();

    const { error } = await supabaseClient
      .from("bookings")
      .insert({
        company: companyEl.value,
        barracks: barracksEl.value.trim(),
        booking_date: dateEl.value,
        booking_time: selectedTime
      });

    if (error) {

      console.error(error);

      if (error.code === "23505") {
        showMessage(
          "방금 다른 사람이 예약했습니다. 다른 시간을 선택해주세요.",
          "error"
        );
      } else {
        showMessage(
          "예약에 실패했습니다. 잠시 후 다시 시도해주세요.",
          "error"
        );
      }

      await loadBookedTimes();

      reserveBtn.textContent = "예약하기";
      checkForm();

      return;
    }

    showMessage(
      `${dateEl.value} ${selectedTime} 예약이 완료되었습니다.`,
      "success"
    );

    reserveBtn.textContent = "예약 완료";

    // 입력값 초기화
    companyEl.value = "";
    barracksEl.value = "";
    dateEl.value = "";
    timesEl.innerHTML = "";
    selectedTime = "";

    setTimeout(() => {
      reserveBtn.textContent = "예약하기";
      reserveBtn.disabled = true;
    }, 2000);
  });

</script>

</body>
</html>
