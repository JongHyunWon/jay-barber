<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAY BARBER 예약</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1c1c1a;--mute:#8a877f;--line:#e3dfd6;--ok:#1f6f4a;--okbg:#e4f2ea;--full:#b3361f;--fullbg:#f9e3de;--sel:#1c1c1a}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--card:#222220;--ink:#f1efe9;--mute:#9a978e;--line:#383631;--ok:#6fd1a0;--okbg:#1c3228;--full:#ff9a84;--fullbg:#3a2420;--sel:#f1efe9}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:.5px}
.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.step{font-weight:700;margin:0 0 12px;font-size:16px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mh b{font-size:17px}
.nav{width:40px;height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:18px;cursor:pointer}
.nav:disabled{opacity:.3;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--mute);padding:4px 0}
.dow:first-child,.day.sun{color:var(--full)}
.day{aspect-ratio:1/1.05;border:1px solid transparent;border-radius:10px;background:none;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.day small{font-size:10px}
.day.ok{background:var(--okbg);border-color:var(--ok);font-weight:700}
.day.ok small{color:var(--ok)}
.day.full{background:var(--fullbg);color:var(--full);cursor:not-allowed;text-decoration:line-through}
.day.full small{text-decoration:none}
.day.off{color:var(--mute);opacity:.35;cursor:not-allowed}
.day.sel{background:var(--sel);color:var(--card);border-color:var(--sel)}
.day.sel small{color:var(--card)}
.day:focus-visible,.slot:focus-visible,.nav:focus-visible,.go:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:12px 4px;border-radius:10px;border:1px solid var(--ok);background:var(--okbg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.slot small{font-size:11px;font-weight:400;color:var(--ok)}
.slot.taken{background:var(--fullbg);border-color:var(--fullbg);color:var(--full);cursor:not-allowed;text-decoration:line-through}
.slot.taken small{color:var(--full);text-decoration:none}
.slot.sel{background:var(--sel);border-color:var(--sel);color:var(--card)}
.slot.sel small{color:var(--card)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
select,input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.go{width:100%;margin-top:16px;padding:15px;border:0;border-radius:10px;background:var(--sel);color:var(--card);font:inherit;font-weight:700;cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}
.summary{background:var(--okbg);border-radius:10px;padding:12px;font-weight:700;margin-bottom:4px}
.msg{margin-top:12px;font-size:14px;white-space:pre-wrap}
.msg.err{color:var(--full)}.msg.good{color:var(--ok);font-weight:700}
.notice{background:var(--fullbg);color:var(--full);border-radius:10px;padding:12px;font-size:14px;margin-bottom:12px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>JAY BARBER</h1>
  <p class="sub">초록색으로 표시된 날짜와 시간만 예약할 수 있어요.</p>

  <div class="card">
    <p class="step">1. 날짜 선택</p>
    <div class="notice hidden" id="notice"></div>
    <div class="mh">
      <button class="nav" id="prev" type="button" aria-label="이전 달">‹</button>
      <b id="monthLabel"></b>
      <button class="nav" id="next" type="button" aria-label="다음 달">›</button>
    </div>
    <div class="grid" id="dows"></div>
    <div class="grid" id="days"></div>
    <div class="legend">
      <span><i style="background:var(--okbg);border:1px solid var(--ok)"></i>예약 가능</span>
      <span><i style="background:var(--fullbg)"></i>마감</span>
      <span><i style="background:var(--line)"></i>예약 불가</span>
    </div>
  </div>

  <div class="card hidden" id="timeCard">
    <p class="step" id="timeTitle">2. 시간 선택</p>
    <div class="slots" id="slots"></div>
  </div>

  <div class="card hidden" id="formCard">
    <p class="step">3. 정보 입력</p>
    <div class="summary" id="summary"></div>
    <label for="name">이름</label>
    <input id="name" placeholder="예: 홍길동" maxlength="20">
    <label for="company">중대</label>
    <select id="company">
      <option value="">선택하세요</option>
      <option value="작전지원 중대">작전지원 중대</option>
      <option value="본부중대">본부중대</option>
    </select>
    <label for="barracks">생활관</label>
    <input id="barracks" placeholder="예: 2생활관">
    <button class="go" id="submit" type="button">예약하기</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
(() => {
  const DAYS_AHEAD = 60;

  const sb = window.supabase.createClient(
    "https://rupsdtnlkxyesgvnwpor.supabase.co",
    "sb_publishable_OIcz_R6kDyWs8z_rZN1V_w_-CTf5Fno"
  );
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const DOW = ["일","월","화","수","목","금","토"];

  const today = new Date(); today.setHours(0,0,0,0);
  const last = new Date(today); last.setDate(last.getDate() + DAYS_AHEAD);
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  let slots = {};
  let selDate = null, selTime = null;

  $("dows").innerHTML = DOW.map(d => `<div class="dow">${d}</div>`).join("");

  async function loadSlots() {
    const all = [];
    let from = 0;
    while (true) {
      const { data, error } = await sb
        .rpc("get_open_slots", { start_date: fmt(today), end_date: fmt(last) })
        .range(from, from + 999);
      if (error) { console.error(error); return false; }
      all.push(...data);
      if (data.length < 1000) break;
      from += 1000;
    }
    slots = {};
    all.forEach(r => {
      (slots[r.slot_date] = slots[r.slot_date] || []).push({
        t: String(r.slot_time).slice(0, 5), booked: r.is_booked
      });
    });
    return true;
  }

  function passed(dateStr, t) {
    if (dateStr !== fmt(new Date())) return false;
    const now = new Date();
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m <= now.getHours() * 60 + now.getMinutes();
  }

  const freeCount = ds => (slots[ds] || []).filter(s => !s.booked && !passed(ds, s.t)).length;

  function renderCalendar() {
    $("monthLabel").textContent = `${view.getFullYear()}년 ${view.getMonth()+1}월`;
    $("prev").disabled = view <= new Date(today.getFullYear(), today.getMonth(), 1);
    $("next").disabled = new Date(view.getFullYear(), view.getMonth()+1, 1) > last;

    const first = view.getDay();
    const count = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
    let html = "";
    for (let i = 0; i < first; i++) html += "<div></div>";
    for (let n = 1; n <= count; n++) {
      const d = new Date(view.getFullYear(), view.getMonth(), n);
      const ds = fmt(d);
      const sun = d.getDay() === 0 ? " sun" : "";
      const hasSlots = (slots[ds] || []).length > 0;
      if (d < today || d > last || !hasSlots) {
        html += `<button class="day off${sun}" disabled>${n}</button>`;
        continue;
      }
      const free = freeCount(ds);
      const sel = ds === selDate ? " sel" : "";
      if (free === 0) {
        html += `<button class="day full${sun}" disabled>${n}<small>마감</small></button>`;
      } else {
        html += `<button class="day ok${sun}${sel}" data-date="${ds}">${n}<small>${free}자리</small></button>`;
      }
    }
    $("days").innerHTML = html;
  }

  function renderSlots() {
    const d = new Date(selDate + "T00:00:00");
    $("timeTitle").textContent = `2. 시간 선택 (${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일)`;
    $("slots").innerHTML = (slots[selDate] || []).map(s => {
      if (s.booked) return `<button class="slot taken" disabled>${s.t}<small>예약됨</small></button>`;
      if (passed(selDate, s.t)) return `<button class="slot taken" disabled>${s.t}<small>마감</small></button>`;
      return `<button class="slot${s.t === selTime ? " sel" : ""}" data-time="${s.t}">${s.t}<small>예약 가능</small></button>`;
    }).join("");
    $("timeCard").classList.remove("hidden");
  }

  function renderForm() {
    if (!selDate || !selTime) { $("formCard").classList.add("hidden"); return; }
    const d = new Date(selDate + "T00:00:00");
    $("summary").textContent = `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]}) ${selTime}`;
    $("formCard").classList.remove("hidden");
  }

  function setMsg(text, cls) { $("msg").textContent = text; $("msg").className = "msg " + (cls || ""); }

  $("days").addEventListener("click", e => {
    const b = e.target.closest("[data-date]"); if (!b) return;
    selDate = b.dataset.date; selTime = null;
    setMsg("");
    renderCalendar(); renderSlots(); renderForm();
    $("timeCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
  });

  $("slots").addEventListener("click", e => {
    const b = e.target.closest("[data-time]"); if (!b) return;
    selTime = b.dataset.time;
    setMsg("");
    renderSlots(); renderForm();
    $("formCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
  });

  $("prev").addEventListener("click", () => { view = new Date(view.getFullYear(), view.getMonth()-1, 1); renderCalendar(); });
  $("next").addEventListener("click", () => { view = new Date(view.getFullYear(), view.getMonth()+1, 1); renderCalendar(); });

  async function refresh() {
    await loadSlots();
    selTime = null;
    renderCalendar();
    if (selDate && freeCount(selDate) > 0) renderSlots();
    else { selDate = null; $("timeCard").classList.add("hidden"); }
    renderForm();
  }

  $("submit").addEventListener("click", async () => {
    const name = $("name").value.trim();
    const company = $("company").value;
    const barracks = $("barracks").value.trim();
    if (!name) return setMsg("이름을 입력하세요.", "err");
    if (!company) return setMsg("중대를 선택하세요.", "err");
    if (!barracks) return setMsg("생활관을 입력하세요.", "err");

    $("submit").disabled = true;
    setMsg("예약 중...");
    try {
      const done = `${$("summary").textContent} 예약이 완료되었습니다.`;
      const { error } = await sb.from("bookings").insert({
        name, company, barracks, booking_date: selDate, booking_time: selTime + ":00"
      });
      if (error) {
        let t;
        if (error.code === "23505") t = "방금 다른 분이 이 시간을 예약했습니다. 다른 시간을 선택하세요.";
        else if (error.code === "42501") t = "예약할 수 없는 시간입니다. (권한 오류 42501)";
        else t = "예약 실패: " + error.message;
        setMsg(t, "err");
        alert(t);
        if (error.code === "23505") await refresh();
        return;
      }
      $("name").value = ""; $("barracks").value = ""; $("company").value = "";
      await refresh();
      $("formCard").classList.remove("hidden");
      $("summary").textContent = "예약 완료";
      setMsg(done, "good");
      alert(done);
    } catch (e) {
      setMsg("오류: " + e.message, "err");
      alert("오류: " + e.message);
    } finally {
      $("submit").disabled = false;
    }
  });

  (async () => {
    const ok = await loadSlots();
    renderCalendar();
    const notice = $("notice");
    if (!ok) {
      notice.textContent = "예약 현황을 불러오지 못했습니다. 새로고침 해주세요.";
      notice.classList.remove("hidden");
    } else if (Object.keys(slots).length === 0) {
      notice.textContent = "아직 예약 가능한 날짜가 없습니다. 날짜가 열리면 여기에 표시돼요.";
      notice.classList.remove("hidden");
    }
  })();
})();
</script>
</body>
</html>
