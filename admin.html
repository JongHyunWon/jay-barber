```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAY BARBER 관리자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;color:#111}
.container{max-width:700px;margin:35px auto;padding:20px}
.card{background:white;padding:24px;border-radius:16px;margin-bottom:16px}
input{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
button{width:100%;padding:13px;margin-top:8px;border:0;border-radius:8px;background:#111;color:white;cursor:pointer}
.hidden{display:none!important}
.booking{padding:14px;border:1px solid #ddd;border-radius:10px;margin:10px 0}
.message{margin-top:12px;white-space:pre-wrap}
.small{background:#777}
</style>
</head>
<body>
<div class="container">
  <div class="card" id="loginBox">
    <h1>JAY BARBER</h1>
    <h3>관리자 로그인</h3>
    <input id="email" type="email" placeholder="관리자 이메일">
    <input id="password" type="password" placeholder="비밀번호">
    <button id="loginBtn">로그인</button>
    <button class="small" id="showReset">비밀번호를 잊으셨나요?</button>
    <div class="message" id="loginMsg"></div>
  </div>

  <div class="card hidden" id="resetBox">
    <h2>비밀번호 재설정 이메일</h2>
    <input id="resetEmail" type="email" placeholder="관리자 이메일">
    <button id="sendReset">재설정 이메일 보내기</button>
    <button class="small" id="backLogin">로그인으로 돌아가기</button>
    <div class="message" id="resetMsg"></div>
  </div>

  <div class="card hidden" id="newPasswordBox">
    <h2>새 비밀번호 설정</h2>
    <input id="newPassword" type="password" placeholder="새 비밀번호 (6자 이상)">
    <input id="confirmPassword" type="password" placeholder="새 비밀번호 확인">
    <button id="savePassword">새 비밀번호 저장</button>
    <div class="message" id="passwordMsg"></div>
  </div>

  <div class="card hidden" id="adminBox">
    <h2>예약 관리</h2>
    <button id="refresh">예약 새로고침</button>
    <button class="small" id="logout">로그아웃</button>
    <div id="bookings">예약을 불러오는 중...</div>
  </div>
</div>

<script>
const URL="https://rupsdtnlkxyesgvnwpor.supabase.co";
const KEY="sb_publishable_OIcz_R6kDyWs8z_rZN1V_w_-CTf5Fno";
const sb=window.supabase.createClient(URL,KEY);

const $=id=>document.getElementById(id);
function show(id){$(id).classList.remove("hidden")}
function hide(id){$(id).classList.add("hidden")}
function message(id,text){$(id).textContent=text}

function showOnly(id){
  ["loginBox","resetBox","newPasswordBox","adminBox"].forEach(hide);
  show(id);
}

async function checkAdmin(){
  const {data:{user},error}=await sb.auth.getUser();
  if(error||!user)return false;

  const {data:profile,error:profileError}=await sb
    .from("profiles").select("is_admin").eq("id",user.id).maybeSingle();

  if(profileError||profile?.is_admin!==true){
    await sb.auth.signOut();
    showOnly("loginBox");
    message("loginMsg","관리자 권한을 확인하지 못했습니다. profiles 테이블의 권한을 확인하세요.");
    return false;
  }

  showOnly("adminBox");
  await loadBookings();
  return true;
}

$("loginBtn").onclick=async()=>{
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||!password){message("loginMsg","이메일과 비밀번호를 입력하세요.");return;}

  $("loginBtn").disabled=true;
  message("loginMsg","로그인 중...");
  const {error}=await sb.auth.signInWithPassword({email,password});
  $("loginBtn").disabled=false;

  if(error){message("loginMsg","로그인 실패: "+error.message);return;}
  await checkAdmin();
};

$("showReset").onclick=()=>{
  $("resetEmail").value=$("email").value.trim();
  showOnly("resetBox");
};

$("backLogin").onclick=()=>{
  showOnly("loginBox");
};

$("sendReset").onclick=async()=>{
  const email=$("resetEmail").value.trim();
  if(!email){message("resetMsg","이메일을 입력하세요.");return;}

  $("sendReset").disabled=true;
  const {error}=await sb.auth.resetPasswordForEmail(email,{
    redirectTo:window.location.origin+window.location.pathname
  });
  $("sendReset").disabled=false;

  message("resetMsg",error
    ?"발송 실패: "+error.message+"\nemail rate limit 오류라면 기다렸다가 다시 시도하세요."
    :"재설정 이메일을 확인하세요. 링크를 누르면 이 페이지에서 새 비밀번호를 설정할 수 있습니다.");
};

$("savePassword").onclick=async()=>{
  const p=$("newPassword").value;
  const c=$("confirmPassword").value;
  if(p.length<6){message("passwordMsg","비밀번호는 6자 이상이어야 합니다.");return;}
  if(p!==c){message("passwordMsg","두 비밀번호가 일치하지 않습니다.");return;}

  $("savePassword").disabled=true;
  const {error}=await sb.auth.updateUser({password:p});
  $("savePassword").disabled=false;

  if(error){message("passwordMsg","변경 실패: "+error.message);return;}

  await sb.auth.signOut();
  $("password").value="";
  message("loginMsg","비밀번호가 변경됐습니다. 새 비밀번호로 로그인하세요.");
  showOnly("loginBox");
};

async function loadBookings(){
  $("bookings").textContent="예약을 불러오는 중...";
  const {data,error}=await sb.from("bookings")
    .select("company,barracks,booking_date,booking_time")
    .order("booking_date",{ascending:true})
    .order("booking_time",{ascending:true});

  if(error){$("bookings").textContent="예약 조회 실패: "+error.message;return;}
  if(!data?.length){$("bookings").textContent="현재 예약이 없습니다.";return;}

  $("bookings").replaceChildren();
  data.forEach(b=>{
    const div=document.createElement("div");
    div.className="booking";
    const title=document.createElement("strong");
    title.textContent=`${b.booking_date} ${String(b.booking_time).slice(0,5)}`;
    const detail=document.createElement("p");
    detail.textContent=`중대: ${b.company} / 생활관: ${b.barracks}`;
    div.append(title,detail);
    $("bookings").appendChild(div);
  });
}

$("refresh").onclick=loadBookings;
$("logout").onclick=async()=>{
  await sb.auth.signOut();
  showOnly("loginBox");
  $("password").value="";
};

sb.auth.onAuthStateChange((event)=>{
  if(event==="PASSWORD_RECOVERY"){
    showOnly("newPasswordBox");
    message("passwordMsg","새 비밀번호를 입력하세요.");
  }
});

async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){
    const {data:{user}}=await sb.auth.getUser();
    if(user) await checkAdmin();
  }
}
start();
</script>
</body>
</html>
